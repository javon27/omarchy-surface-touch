[Unit]
StopWhenUnneeded=no
# No burst limit -- however often this dies, keep restarting it. The root
# cause (periodic "Interrupted system call" on the hidraw read, roughly
# correlated with idle/screensaver activity) isn't fully nailed down yet,
# so this is the safety net that keeps touch from staying down regardless.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=1
